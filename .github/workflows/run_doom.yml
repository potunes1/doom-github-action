name: run doom

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  run_doom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Doom container in background
        run: |
          docker pull kasmweb/doom:1.19.0
          docker run -d --rm \
            --name doom-session \
            --shm-size=512m \
            -p 6901:6901 \
            -e VNC_PW=${{ secrets.VNC_PW }} \
            kasmweb/doom:1.19.0

      - name: Wait for Doom to be ready
        run: |
          echo "Waiting for KasmVNC on port 6901..."
          for i in {1..30}; do
            if curl -k -s https://localhost:6901 > /dev/null; then
              echo "Doom is up!"
              break
            fi
            sleep 2
          done

      - name: Install and start ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

          ngrok config add-authtoken "$NGROK_TOKEN"
          nohup ngrok http 6901 --log=stdout > /tmp/ngrok.log 2>&1 &

          echo "Waiting for ngrok API on port 4040..."
          for i in {1..15}; do
            if curl -s http://localhost:4040/api/tunnels \
                | jq -e '.tunnels[0].public_url' > /dev/null 2>&1; then
              echo "ngrok tunnel is ready."
              break
            fi
            sleep 2
          done
          cat /tmp/ngrok.log

      - name: Get public URL and create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "Public URL: $URL"
          gh issue create \
            --title "🎮 DOOM is live: $URL" \
            --body "Play DOOM here: $URL

          Username: kasm_user
          Password: (the one stored in your VNC_PW secret)" \
            --repo ${{ github.repository }}

      - name: Keep job alive for 30 minutes
        run: sleep 1800
